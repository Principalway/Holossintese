<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Oráculo da Holossíntese</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; text-align: center; padding: 50px; }
        h1 { color: #3a3a3a; }
        button { padding: 10px 20px; font-size: 18px; background: #007BFF; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background: #0056b3; }
        #mensagem { margin-top: 30px; font-size: 22px; color: #333; min-height: 50px; }
    </style>
</head>
<body>
    <h1>Oráculo da Holossíntese</h1>
    <p>Clique no botão para receber uma mensagem</p>
    <button onclick="sortear()">Sortear Mensagem</button>
    <div id="mensagem"></div>

    <script>
        const mensagens = [
            "Faça push do array até 18h. Se o botão ainda consolar, o dia não ocorreu.",
            "A sombra não é luz interior: nomeie um ato evitado e execute-o antes das 18h.",
            "Fique em pé dez minutos sem tela. Se sentar, esta frase falhou hoje.",
            "Não desapegue do controle: edite o arquivo e publique o SHA.",
            "Criatividade sem artefato é texto. Entregue um objeto concreto em 45 min.",
            "O passado do repo é o array de agosto. Troque três strings ou o histórico se repete.",
            "Você não é fractal. Confira o SHA de oraculo_holossintese.html antes das 18h.",
            "Sinta com o corpo: dez respirações de pé agora. Pensar não substitui.",
            "Cada emoção pode esperar. Primeiro o diff; depois o relato.",
            "Simplicidade é um commit no array. README novo é evasão."
        ];

        function sortear() {
            const indice = Math.floor(Math.random() * mensagens.length);
            document.getElementById("mensagem").innerText = mensagens[indice];
        }
    </script>
</body>
</html>
